<style>
      /* Base Circuit Infrastructure */
      .base-circuit {
        stroke: #0c241c;
        stroke-width: 2.2;
        fill: none;
        stroke-linecap: round;
        stroke-linejoin: round;
      }

      /* 
        MASTER PHYSICS CURRENT PROPAGATION TIMELINE (Cycle: 4.8s):
        Stage 1: 0.0s -> 1.5s (0% -> 31%): Current streams travel along wire networks into the 6 emblem entry nodes.
        Stage 2: 1.5s -> 2.4s (31% -> 50%): Current reaches emblem! Flows along outer orbital ring arcs and inward.
        Stage 3: 2.2s -> 3.0s (45% -> 62%): Current sweeps into the inner orbital arcs, circling and charging the center.
        Stage 4: 2.8s -> 3.3s (58% -> 68%): Current traces the perimeter and core of the central lightning bolt from tip to tip.
        Stage 5: 3.2s -> 4.2s (66% -> 87%): Emblem FULLY ILLUMINATES with high-voltage emerald glow, sending power down to ZEROWATT sign & Tagline box!
        Stage 6: 4.2s -> 4.8s (87% -> 100%): Power dissipates smoothly back to dark, ready for next pulse.
      */

      /* Wire Pulse Animation (0% to 32%) */
      @keyframes wireCurrentLT {
        0% { stroke-dashoffset: 460; opacity: 0; }
        4% { opacity: 1; }
        29% { stroke-dashoffset: 0; opacity: 1; }
        33% { opacity: 0; }
        100% { stroke-dashoffset: 0; opacity: 0; }
      }
      @keyframes wireCurrentRT {
        0% { stroke-dashoffset: 470; opacity: 0; }
        4% { opacity: 1; }
        29% { stroke-dashoffset: 0; opacity: 1; }
        33% { opacity: 0; }
        100% { stroke-dashoffset: 0; opacity: 0; }
      }
      @keyframes wireCurrentLB {
        0% { stroke-dashoffset: 450; opacity: 0; }
        4% { opacity: 1; }
        29% { stroke-dashoffset: 0; opacity: 1; }
        33% { opacity: 0; }
        100% { stroke-dashoffset: 0; opacity: 0; }
      }
      @keyframes wireCurrentRB {
        0% { stroke-dashoffset: 470; opacity: 0; }
        4% { opacity: 1; }
        29% { stroke-dashoffset: 0; opacity: 1; }
        33% { opacity: 0; }
        100% { stroke-dashoffset: 0; opacity: 0; }
      }

      .p-lt {
        stroke-dasharray: 120 400;
        animation: wireCurrentLT 4.8s cubic-bezier(0.35, 0, 0.25, 1) infinite;
      }
      .p-rt {
        stroke-dasharray: 120 400;
        animation: wireCurrentRT 4.8s cubic-bezier(0.35, 0, 0.25, 1) infinite;
      }
      .p-lb {
        stroke-dasharray: 120 400;
        animation: wireCurrentLB 4.8s cubic-bezier(0.35, 0, 0.25, 1) infinite;
      }
      .p-rb {
        stroke-dasharray: 120 400;
        animation: wireCurrentRB 4.8s cubic-bezier(0.35, 0, 0.25, 1) infinite;
      }

      /* Outer Orbital Arc Stream Animation (Active 29% -> 55%) */
      @keyframes outerRingTrace1 {
        0%, 28% { stroke-dashoffset: 280; opacity: 0; }
        30% { opacity: 1; }
        46% { stroke-dashoffset: 0; opacity: 1; }
        54% { opacity: 0.2; }
        100% { stroke-dashoffset: 0; opacity: 0; }
      }
      @keyframes outerRingTrace2 {
        0%, 30% { stroke-dashoffset: 280; opacity: 0; }
        32% { opacity: 1; }
        48% { stroke-dashoffset: 0; opacity: 1; }
        56% { opacity: 0.2; }
        100% { stroke-dashoffset: 0; opacity: 0; }
      }
      .emblem-pulse-outer-1 {
        stroke-dasharray: 80 280;
        animation: outerRingTrace1 4.8s cubic-bezier(0.4, 0, 0.2, 1) infinite;
      }
      .emblem-pulse-outer-2 {
        stroke-dasharray: 80 280;
        animation: outerRingTrace2 4.8s cubic-bezier(0.4, 0, 0.2, 1) infinite;
      }

      /* Inner Orbital Arc Stream Animation (Active 42% -> 66%) */
      @keyframes innerRingTrace {
        0%, 40% { stroke-dashoffset: 240; opacity: 0; }
        43% { opacity: 1; }
        58% { stroke-dashoffset: 0; opacity: 1; }
        64% { opacity: 0.2; }
        100% { stroke-dashoffset: 0; opacity: 0; }
      }
      .emblem-pulse-inner {
        stroke-dasharray: 70 240;
        animation: innerRingTrace 4.8s cubic-bezier(0.4, 0, 0.2, 1) infinite;
      }

      /* Lightning Bolt Path Current Trace (Active 54% -> 70%) */
      @keyframes boltContourTrace {
        0%, 52% { stroke-dashoffset: 520; opacity: 0; }
        55% { opacity: 1; }
        68% { stroke-dashoffset: 0; opacity: 1; }
        72% { opacity: 0.3; }
        100% { stroke-dashoffset: 0; opacity: 0; }
      }
      .bolt-contour-stream {
        stroke-dasharray: 90 520;
        animation: boltContourTrace 4.8s cubic-bezier(0.3, 0, 0.2, 1) infinite;
      }

      /* Entire Emblem Illumination (Off 0% -> 62%, ignites as current completes circuit at 64%, stays illuminated till 86%) */
      @keyframes emblemGlowPower {
        0%, 62% {
          opacity: 0.08;
          stroke: #0d281e;
          filter: none;
        }
        65% {
          opacity: 0.6;
          stroke: #34d399;
          filter: drop-shadow(0 0 10px #10b981);
        }
        68% {
          opacity: 1;
          stroke: #6ee7b7;
          filter: drop-shadow(0 0 18px #34d399) drop-shadow(0 0 35px rgba(16, 185, 129, 0.8));
        }
        84% {
          opacity: 0.95;
          stroke: #10b981;
          filter: drop-shadow(0 0 12px #10b981);
        }
        94%, 100% {
          opacity: 0.08;
          stroke: #0d281e;
          filter: none;
        }
      }

      /* Central Bolt Fill Ignition */
      @keyframes boltFillIgnite {
        0%, 62% {
          opacity: 0.04;
          transform: scale(0.98);
          filter: none;
        }
        65% {
          opacity: 0.7;
          transform: scale(1.02);
        }
        68% {
          opacity: 1;
          transform: scale(1.04);
          filter: drop-shadow(0 0 28px #34d399) drop-shadow(0 0 60px rgba(16, 185, 129, 0.85));
        }
        74% {
          opacity: 1;
          transform: scale(1);
          filter: drop-shadow(0 0 18px #10b981);
        }
        85% {
          opacity: 0.9;
          transform: scale(1);
          filter: drop-shadow(0 0 10px #10b981);
        }
        93%, 100% {
          opacity: 0.04;
          transform: scale(0.98);
          filter: none;
        }
      }

      /* Ambient Light Ignites when Emblem is Powered */
      @keyframes ambientLightRise {
        0%, 62% { opacity: 0; transform: scale(0.7); }
        66% { opacity: 0.85; transform: scale(1.1); }
        72% { opacity: 0.65; transform: scale(1); }
        84% { opacity: 0.45; }
        94%, 100% { opacity: 0; transform: scale(0.7); }
      }

      /* Sign Text "ZEROWATT" Illumination (Off until emblem activates at 66%) */
      @keyframes signBrandIlluminate {
        0%, 64% {
          fill: #193327;
          opacity: 0.4;
          filter: none;
        }
        67% {
          fill: #ecfdf5;
          opacity: 1;
          filter: drop-shadow(0 0 16px rgba(110, 231, 183, 0.95)) drop-shadow(0 0 30px rgba(16, 185, 129, 0.8));
        }
        83% {
          fill: #d1fae5;
          opacity: 0.95;
          filter: drop-shadow(0 0 10px rgba(52, 211, 153, 0.6));
        }
        94%, 100% {
          fill: #193327;
          opacity: 0.4;
          filter: none;
        }
      }

      /* Tagline Box Illumination */
      @keyframes tagBoxSurge {
        0%, 65% {
          stroke: #0f3024;
          fill: #06140e;
          filter: none;
        }
        68% {
          stroke: #34d399;
          fill: #081e15;
          filter: drop-shadow(0 0 16px rgba(52, 211, 153, 0.7));
        }
        84% {
          stroke: #10b981;
          fill: #081e15;
          filter: drop-shadow(0 0 8px rgba(16, 185, 129, 0.4));
        }
        94%, 100% {
          stroke: #0f3024;
          fill: #06140e;
          filter: none;
        }
      }

      /* Tagline Bold & Italic Text Illumination */
      @keyframes tagTextIlluminate {
        0%, 65% {
          fill: #1d3e30;
          filter: none;
          opacity: 0.4;
        }
        68% {
          fill: #ecfdf5;
          opacity: 1;
          filter: drop-shadow(0 0 12px rgba(110, 231, 183, 0.95));
        }
        84% {
          fill: #a7f3d0;
          opacity: 0.95;
          filter: drop-shadow(0 0 6px rgba(52, 211, 153, 0.6));
        }
        94%, 100% {
          fill: #1d3e30;
          filter: none;
          opacity: 0.4;
        }
      }

      /* Continuous subtle orbit spin for technical dynamism */
      @keyframes ringSpinSlow {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
      }
      @keyframes ringSpinReverse {
        0% { transform: rotate(360deg); }
        100% { transform: rotate(0deg); }
      }

      .ambient-glow-circle {
        transform-origin: 450px 235px;
        animation: ambientLightRise 4.8s ease-out infinite;
      }
      .emblem-outer-assembly {
        animation: emblemGlowPower 4.8s ease-out infinite;
      }
      .emblem-inner-assembly {
        animation: emblemGlowPower 4.8s ease-out infinite;
      }
      .bolt-power-core {
        transform-origin: 450px 235px;
        animation: boltFillIgnite 4.8s cubic-bezier(0.16, 1, 0.3, 1) infinite;
      }
      .brand-title-text {
        animation: signBrandIlluminate 4.8s ease-in-out infinite;
      }
      .tagline-box-el {
        animation: tagBoxSurge 4.8s ease-in-out infinite;
      }
      .tagline-text-el {
        animation: tagTextIlluminate 4.8s ease-in-out infinite;
      }
      .orbital-spin-slow {
        transform-origin: 450px 235px;
        animation: ringSpinSlow 20s linear infinite;
      }
      .orbital-spin-rev {
        transform-origin: 450px 235px;
        animation: ringSpinReverse 14s linear infinite;
      }
    </style>
</defs>
